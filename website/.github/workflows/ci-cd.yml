name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. TEST VA BUILD TEKSHIRISH
  # ==========================================
  build-and-test:
    name: 🔍 Build & Syntax Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 🐍 Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Python bog'liqliklarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Python sintaksisini tekshirish
        run: |
          python -m py_compile main.py database.py schemas.py

      - name: ⚡ Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🌐 Frontendni build qilishni tekshirish
        working-directory: ./website
        run: |
          npm install
          npx vite build

  # ==========================================
  # 2. SERVERGA AVTOMATIK DEPLOY QILISH
  # ==========================================
  deploy:
    name: 🚀 Deploy to Production Server
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: 🔐 SSH orqali Serverga ulanish va Deploy qilish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Yangilanish boshlanmoqda..."
            cd ${{ secrets.SERVER_PROJECT_PATH || '/var/www/kichik-alloma' }}
            
            # Yangi kodni olish
            git pull origin main || git pull origin master
            
            # Docker konteynerlarni qayta qurish va ishga tushirish
            docker compose down
            docker compose up -d --build
            
            # Eskirgan Docker keshlarni tozalash
            docker image prune -f
            
            echo "✅ Deploy muvaffaqiyatli yakunlandi!"
